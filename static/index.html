<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicles of Prasa</title>
    <!-- Pixel/RPG Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --rpg-border: 4px solid #d4af37; /* Gold */
            --box-bg: #2b2b2b;
            --text-color: #f4f4f4;
            --user-color: #6495ed; /* Cornflower Blue */
            --npc-color: #ff6347; /* Tomato */
            --font-stack: 'VT323', monospace;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-size: 1.25rem;
        }

        header {
            background-color: rgba(0, 0, 0, 0.8);
            border-bottom: var(--rpg-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 { margin: 0; font-size: 2rem; color: #d4af37; text-shadow: 2px 2px 0 #000; }

        #chat-container {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        .message-wrapper {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            max-width: 85%;
        }

        .user-wrapper {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .ai-wrapper {
            align-self: flex-start;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border: var(--rpg-border);
            background-color: #000;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .ai-avatar {
            /* Placeholder for a wizard/NPC face */
            background-image: url('https://api.dicebear.com/7.x/bottts/svg?seed=Eldrin&backgroundColor=333');
        }
        
        .user-avatar {
            background-image: url('https://api.dicebear.com/7.x/adventurer/svg?seed=Hero');
        }

        .message {
            background-color: rgba(0, 0, 0, 0.8);
            border: var(--rpg-border);
            padding: 1rem;
            line-height: 1.4;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            animation: typeIn 0.2s ease-out;
        }

        @keyframes typeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .user-message {
            border-color: var(--user-color);
            color: #fff;
        }

        .ai-message {
            border-color: #d4af37;
            color: #d4af37;
        }

        #input-container {
            background-color: rgba(0, 0, 0, 0.9);
            border-top: var(--rpg-border);
            padding: 1.5rem;
            display: flex;
            justify-content: center;
        }

        form {
            display: flex;
            gap: 1rem;
            max-width: 800px;
            width: 100%;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 1rem;
            background-color: #000;
            border: 2px solid #555;
            color: #fff;
            font-family: var(--font-stack);
            font-size: 1.5rem;
            outline: none;
        }

        input[type="text"]:focus-visible {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        button {
            padding: 0 2rem;
            background-color: #000;
            color: #d4af37;
            border: 2px solid #d4af37;
            font-family: var(--font-stack);
            font-size: 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover, button:focus-visible {
            background-color: #d4af37;
            color: #000;
            outline: none;
        }

        #clear-btn {
            font-size: 1.25rem;
            padding: 0.5rem 1rem;
            border-color: #ff6347;
            color: #ff6347;
        }
        
        #clear-btn:hover {
            background-color: #ff6347;
            color: #000;
        }
    </style>
</head>
<body>
    <header>
        <h2>⚔️ Chronicles of Prasa</h2>
        <button id="clear-btn" onclick="clearChat()">Restart Game</button>
    </header>
    
    <div id="chat-container" aria-live="polite">
        <div class="message-wrapper ai-wrapper">
            <div class="avatar ai-avatar" aria-label="Eldrin the NPC"></div>
            <div class="message ai-message">Greetings, traveler. I am Eldrin. What seeks thee in Aethelgard?</div>
        </div>
    </div>

    <div id="input-container">
        <form id="chat-form" onsubmit="sendMessage(event)">
            <input type="text" id="user-input" placeholder="Speak thy mind…" required autocomplete="off" aria-label="Chat input">
            <button type="submit">Speak</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputField = document.getElementById('user-input');

        function appendMessage(role, text, id = null) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('message-wrapper');
            wrapper.classList.add(role === 'user' ? 'user-wrapper' : 'ai-wrapper');
            if (id) wrapper.id = id;

            const avatar = document.createElement('div');
            avatar.classList.add('avatar');
            avatar.classList.add(role === 'user' ? 'user-avatar' : 'ai-avatar');

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(role === 'user' ? 'user-message' : 'ai-message');
            msgDiv.textContent = text;

            wrapper.appendChild(avatar);
            wrapper.appendChild(msgDiv);
            
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const message = inputField.value.trim();
            if (!message) return;

            appendMessage('user', message);
            inputField.value = '';

            const loadingId = 'loading-' + Date.now();
            appendMessage('ai', 'Eldrin is thinking…', loadingId);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                document.getElementById(loadingId).remove();
                
                if (response.ok) {
                    appendMessage('ai', data.response);
                } else {
                    appendMessage('ai', `*System Error*: ${data.detail}`);
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('ai', `*Connection Lost*: ${error.message}`);
            }
        }

        async function clearChat() {
            try {
                await fetch('/clear', { method: 'POST' });
                chatContainer.innerHTML = '';
                appendMessage('ai', 'The timeline has reset. Greetings, traveler.');
            } catch (error) {
                alert('Failed to restart.');
            }
        }
    </script>
</body>
</html>
